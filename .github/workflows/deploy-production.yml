name: MomHaven CI and production deploy

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: 20
  PROJECT_ID: mom-haven
  REGION: europe-west1
  CLOUD_RUN_SERVICE: momhaven-api
  DEPLOY_SERVICE_ACCOUNT: momhaven-deploy@mom-haven.iam.gserviceaccount.com
  WIF_PROVIDER: projects/306450754584/locations/global/workloadIdentityPools/github/providers/mom-haven
  WIF_AUDIENCE: https://iam.googleapis.com/projects/306450754584/locations/global/workloadIdentityPools/github/providers/mom-haven

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint

  clinical:
    name: Clinical tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run clinical tests
        run: npm run test:clinical

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build

  deploy:
    name: Deploy production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [typecheck, clinical, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          audience: ${{ env.WIF_AUDIENCE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --service-account momhaven-runtime@mom-haven.iam.gserviceaccount.com

      - name: Verify backend health
        run: |
          curl --fail --show-error --silent \
            "https://${CLOUD_RUN_SERVICE}-306450754584.${REGION}.run.app/api/health"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore rules and Firebase Hosting
        run: firebase deploy --only firestore,hosting --project "$PROJECT_ID" --non-interactive
