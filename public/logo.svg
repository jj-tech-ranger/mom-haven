<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" fill="none">
  <defs>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33178A"/>
      <stop offset="100%" stop-color="#9167C2"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#9167C2"/>
      <stop offset="100%" stop-color="#B79CDA"/>
    </linearGradient>
  </defs>

  <g transform="translate(40, 20)">
    <!-- Kenya Map Outline in Thin Purple -->
    <path d="M 330,50 L 360,55 L 430,70 L 460,110 L 450,150 L 490,165 L 530,220 L 515,260 L 518,310 L 470,360 L 455,340 L 430,345 L 390,320 L 360,335 L 350,310 L 370,280 L 355,270 L 335,290 L 330,250 L 335,210 L 315,195 L 320,150 L 335,120 Z" 
          stroke="#4A1E9E" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.95" />

    <!-- Mother Hair / Outer Contour -->
    <path d="M 210,50 C 130,50 80,120 80,220 C 80,310 140,410 230,440 C 150,390 120,300 135,220 C 145,160 180,110 235,80 C 275,60 300,85 300,125 C 300,165 270,200 240,230 C 215,255 190,290 200,340 C 210,380 240,410 265,440 C 285,410 325,380 340,330 C 365,240 330,160 290,110 C 265,80 240,50 210,50 Z" 
          fill="#5B29B3" />

    <!-- Inner Hair Flow Layer -->
    <path d="M 170,120 C 130,170 120,240 145,300 C 160,340 190,380 230,410 C 175,370 155,310 160,250 C 165,190 200,145 240,110 C 220,105 190,108 170,120 Z" 
          fill="#7C3AED" opacity="0.6" />

    <!-- Mother Face & Neck Profile -->
    <path d="M 240,110 C 270,140 280,180 260,220 C 250,240 230,260 215,285 C 205,305 200,330 205,355 C 210,380 225,405 245,430 C 215,400 180,360 180,300 C 180,240 205,180 240,110 Z" 
          fill="#FFFFFF" />

    <!-- Mother Closed Peaceful Eye & Eyebrow & Nose & Lips in Profile -->
    <path d="M 252,145 C 258,142 268,144 274,150" stroke="#33178A" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 255,160 C 260,166 268,166 272,161" stroke="#33178A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 276,170 C 283,180 280,186 273,190 C 267,193 260,190 258,196 C 255,204 265,208 270,210" stroke="#33178A" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Baby Form / Nested Sleeping Infant in Mother's Embrace -->
    <!-- Baby Swaddle / Heart base -->
    <path d="M 230,220 C 290,200 350,250 330,320 C 315,370 265,420 230,440 C 250,380 265,330 245,280 C 235,255 225,235 230,220 Z" 
          fill="#5B29B3" />

    <!-- Baby Skin Body & Face -->
    <path d="M 240,280 C 240,240 280,230 300,260 C 315,280 310,310 290,325 C 265,340 240,320 240,280 Z" 
          fill="#FFFFFF" />

    <!-- Baby Features (Sleeping Eye, Nose, Cute Ear, Hand) -->
    <path d="M 282,270 C 287,274 293,274 296,270" stroke="#33178A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 299,275 C 302,279 299,282 295,283" stroke="#33178A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M 288,290 C 293,293 298,291 300,287" stroke="#33178A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Baby little hand on mother -->
    <path d="M 252,280 C 258,272 268,276 270,284 C 270,292 260,296 252,288 Z" fill="#FFFFFF" stroke="#5B29B3" stroke-width="1.5"/>

    <!-- Outer Protective Botanical Leaf Petals (Left and Right forming Heart Cradle) -->
    <path d="M 120,330 C 100,380 130,450 200,480 C 150,450 120,400 120,330 Z" fill="#9167C2" opacity="0.9" />
    <path d="M 130,350 C 160,450 220,485 245,490 C 200,470 160,420 145,360 Z" fill="#7C3AED" />

    <path d="M 370,330 C 390,380 360,450 290,480 C 340,450 370,400 370,330 Z" fill="#9167C2" opacity="0.9" />
    <path d="M 360,350 C 330,450 270,485 245,490 C 290,470 330,420 345,360 Z" fill="#7C3AED" />

    <!-- Central Little Heart Accent at the Bottom Stem -->
    <path d="M 245,475 C 245,475 235,463 226,470 C 218,477 222,488 245,505 C 268,488 272,477 264,470 C 255,463 245,475 245,475 Z" fill="#33178A" />
  </g>

  <!-- Typography Wordmark: MomHaven -->
  <g transform="translate(60, 520)">
    <text x="140" y="0" font-family="'Baloo 2', 'Inter', sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
      <tspan fill="#241451">Mom</tspan><tspan fill="#7C3AED">Haven</tspan>
    </text>
  </g>

  <!-- Tagline Framed by Heartbeat Pulse Lines -->
  <g transform="translate(50, 560)">
    <!-- Left Heartbeat Line -->
    <path d="M 20,0 L 70,0 L 78,-10 L 86,12 L 94,-14 L 102,8 L 108,0 L 125,0" 
          stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Tagline Text -->
    <text x="135" y="4" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#241451" letter-spacing="0.2">
      Every Mother, Every Child, Every Milestone
    </text>

    <!-- Right Heartbeat Line -->
    <path d="M 525,0 L 542,0 L 548,-10 L 556,12 L 564,-14 L 572,8 L 580,0 L 630,0" 
          stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
